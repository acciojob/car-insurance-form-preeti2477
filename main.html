<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Insurance Registration Form</title>
</head>
<body>

<form method="post">
    <!-- Name -->
    <label for="name">Name</label>
    <input type="text" id="name" required>
    <br><br>

    <!-- Email -->
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <br><br>

    <!-- Gender -->
    <label>Gender</label>
    <input type="radio" name="gender" id="male" value="male" required>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="female" value="female" required>
    <label for="female">Female</label>
    <input type="radio" name="gender" id="other" value="other" required>
    <label for="other">Other</label>
    <br><br>

    <!-- Car Brands - CORRECTED ID -->
    <label for="cars">Car Brands</label>
    <select id="cars">
        <option value="BMW">BMW</option>
        <option value="Audi">Audi</option>
        <option value="Mercedez">Mercedez</option>
    </select>
    <br><br>

    <!-- Car Age - CORRECTED ID -->
    <label for="carage">Car Age</label>
    <input type="number" id="carage" required>
    <br><br>

    <!-- Date of Purchase - CORRECTED ID -->
    <label for="dop">Date of Purchase</label>
    <input type="date" id="dop" required>
    <br><br>

    <!-- Password -->
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <br><br>

    <!-- Submit Button -->
    <button type="submit">Submit</button>
</form>

</body>
</html>
